{% extends 'base.html' %}

{% block content %}
<div class="card" style="max-width: 400px; margin: auto;">
    <h2>Welcome Back</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="width: 100%; margin-top: 1rem;">Sign In</button>
    </form>
    <p style="margin-top: 1rem; text-align: center; font-size: 0.9rem;">
        New here? <a href="{% url 'register' %}">Create an account</a>.
    </p>
</div>
{% endblock %}

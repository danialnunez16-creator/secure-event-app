{% extends 'base.html' %}

{% block title %}Register - Secure Event App{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: auto;">
    <h2>Create an Account</h2>
    <div class="alert alert-warning">
        <strong>Password Rules:</strong> Must be at least 8 characters, mix of letters/numbers.
    </div>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="width: 100%; margin-top: 1rem;">Sign Up</button>
    </form>
    <p style="margin-top: 1rem; text-align: center;">
        Already have an account? <a href="{% url 'login' %}">Log in</a>.
    </p>
</div>
{% endblock %}

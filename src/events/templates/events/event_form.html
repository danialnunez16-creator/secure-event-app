{% extends 'base.html' %}

{% block title %}{{ title }} - Secure Event App{% endblock %}

{% block content %}
<h2>{{ title }}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save Event</button>
</form>
<p><a href="{% url 'event_list' %}">Cancel</a></p>
{% endblock %}
